# Task 3: two-container setup - app + database.
# robin/mini-app  = WordPress stand-in, robin/mini-db = MySQL stand-in (Docker Hub is blocked here).
# The real WordPress + MySQL version is in ../canonical-docker-hub/wordpress-mysql.yml
name: wordpress-stack

services:
  db:                              # <- the SERVICE NAME is the DNS name other containers use
    image: robin/mini-db:1.0
    volumes:
      - db_data:/data              # named volume: the database files survive `down`/`up`

  wordpress:
    image: robin/mini-app:1.0
    depends_on:
      - db                         # start the database first
    ports:
      - "8085:80"
    environment:
      DB_HOST: db                  # connect to the database by its service name
      DB_PORT: "5432"
      SITE_TITLE: "Robin's Compose Blog"

volumes:
  db_data:
